<!DOCTYPE html>
<html>
<head>
    <title>College Management System</title>
    <style>
        table {
            border-collapse: collapse;
            width: 80%;
            text-align: center;
        }
        th, td {
            border: 1px solid black;
            padding: 10px;
        }
        th {
            background-color: lightgray;
        }
    </style>
</head>
<body>

<h2>College Management System</h2>

<table>
    <tr>
        <th rowspan="2">Department</th>
        <th colspan="2">Faculty</th>
        <th colspan="2">Students</th>
    </tr>
    <tr>
        <th>Male</th>
        <th>Female</th>
        <th>Male</th>
        <th>Female</th>
    </tr>

    <tr>
        <td>Computer Science</td>
        <td>10</td>
        <td>8</td>
        <td>120</td>
        <td>100</td>
    </tr>

    <tr>
        <td>Mechanical</td>
        <td>12</td>
        <td>5</td>
        <td>150</td>
        <td>60</td>
    </tr>

    <tr>
        <td>Electrical</td>
        <td>9</td>
        <td>6</td>
        <td>130</td>
        <td>80</td>
    </tr>

</table>

</body>
</html>
